<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de Dépenses Quotidiennes</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Suivi de Dépenses Quotidiennes</h1>
            <div class="date-selector">
                <label for="filter-date">Filtrer par date:</label>
                <input type="date" id="filter-date" value="">
                <button id="today-btn">Aujourd'hui</button>
            </div>
        </header>

        <main>
            <section class="dashboard">
                <div class="total-card">
                    <h2>Total du jour</h2>
                    <div class="total-amount" id="daily-total">0.00 FCFA</div>
                    <div class="current-date" id="current-date"></div>
                </div>
            </section>

            <section class="expense-form">
                <h2>Ajouter une dépense</h2>
                <form id="add-expense-form">
                    <div class="form-group">
                        <label for="expense-title">Titre</label>
                        <input type="text" id="expense-title" required placeholder="Ex: Café du matin">
                    </div>
                    <div class="form-group">
                        <label for="expense-amount">Montant (FCFA)</label>
                        <input type="number" id="expense-amount" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="expense-date">Date</label>
                        <input type="date" id="expense-date" required>
                    </div>
                    <button type="submit" class="btn-primary">Ajouter la dépense</button>
                </form>
            </section>

            <section class="expense-list">
                <h2>Dépenses du jour</h2>
                <div id="expenses-container">
                    <div class="empty-state">
                        <p>Aucune dépense enregistrée pour cette date</p>
                    </div>
                </div>
            </section>

            <section class="chart-section">
                <h2>Graphique des 7 derniers jours</h2>
                <div class="chart-container">
                    <canvas id="week-chart"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
